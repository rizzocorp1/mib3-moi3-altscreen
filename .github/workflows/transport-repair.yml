name: V29 transport repair validation
on:
  push:
    branches: [fix/v29-packet-pacing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Timing, allocation, UDP failure, IDR recovery and unchanged configuration
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-transport-repair.c -ldl -pthread -o /tmp/repair
          /tmp/repair
      - name: Large-picture datagram pacing and bounded failure recovery
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-packet-pacer.c -ldl -pthread -o /tmp/pacer
          /tmp/pacer
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-packet-pacer-network.c -ldl -pthread -o /tmp/pacer-network
          sudo unshare --net sh -c 'ip link set lo up; /tmp/pacer-network'
      - name: Full handler and crypto regressions
        run: |
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-handler.c -ldl -pthread -o /tmp/handler
          sudo unshare --net sh -c 'ip link set lo up; timeout 40 /tmp/handler'
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-homekit-crypto.c -ldl -pthread -lcrypto -o /tmp/crypto
          timeout 30 /tmp/crypto
          gcc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-layout.c -ldl -pthread -o /tmp/layout
          /tmp/layout
          gcc -O1 -g -fsanitize=address,undefined tests/test-aux-refresh.c -ldl -pthread -o /tmp/refresh
          /tmp/refresh
          gcc -O1 -g -fsanitize=address,undefined tests/test-screen-response.c -ldl -pthread -o /tmp/response
          /tmp/response
          python3 tests/test-advertised-fps.py deploy-usb/payload/altscreen_handler.c tests/test-layout.c
      - name: Decode every dependent picture from actual production conversion and mux
        run: |
          python3 -m pip install --timeout 20 --retries 1 --only-binary=:all: --target /tmp/codec-pyav av==19.0.2
          python3 tests/test-interframe.py /tmp/handler
          python3 tests/test-transport-decode.py /tmp/handler
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Real systemd SIGKILL with separate output writer
        run: |
          gcc -O2 -DFILE_GUARD_TEST recovery/file-guard.c -o /tmp/guard
          gcc -O2 recovery/packet-audit-v29.c -o /tmp/packets
          python3 tests/test-map-v29-boot.py /tmp/guard recovery/map-v29-boot.sh.in
          sudo python3 tests/test-map-v29-export.py recovery/map-v29-log-collector.sh
          sudo python3 tests/test-runtime-unit-recovery.py recovery/map-v29-log-collector.sh /tmp/guard /tmp/packets recovery/map-v29-boot.sh.in
          sudo python3 tests/test-runtime-unit-recovery.py recovery/map-v29-log-collector.sh /tmp/guard /tmp/packets recovery/map-v29-boot.sh.in timeout
          python3 tests/test-lease-v29.py deploy-usb/payload/frame-gate-v29.h recovery/map-v29-log-collector.sh /tmp/guard /tmp/packets

  observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile exact deployed observer and exercise metadata/privacy boundaries
        run: |
          gcc -O2 -Wall -Wextra -Werror recovery/packet-audit-v29.c -o /tmp/observer
          gcc -O1 -g -fsanitize=address,undefined tests/test-packet-detail.c -o /tmp/detail
          /tmp/detail
      - name: Real packet capture, kernel drop stats and outgoing VLAN traffic
        run: |
          sudo python3 tests/test-packet-audit-v29.py /tmp/observer recovery/packet-audit-v29.c
          sudo unshare --net python3 tests/test-packet-audit-vlan.py /tmp/observer --isolated
