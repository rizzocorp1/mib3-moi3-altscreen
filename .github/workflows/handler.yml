name: Handler regression tests
on:
  push:
    branches: [fix/handler-offline]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise exact observation library against native fixture
        run: python3 tests/test-security-probe.py deploy-usb/payload/security-probe.c
  stock-info-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise stock-info pass-through and bounded binary snapshots
        run: python3 tests/test-info-probe.py deploy-usb/payload/info-probe-v5.c
  service-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise real service-manager lifecycle
        run: |
          sudo python3 tests/test-systemd-lifecycle.py
          sudo python3 tests/test-systemd-lifecycle.py recovery/info-v5-log-collector.sh
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile actual handler with sanitizers
        run: |
          gcc -shared -fPIC -Wall -Wextra -O2 deploy-usb/payload/altscreen_handler.c -ldl -pthread -o /tmp/handler-host.so
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-handler.c -ldl -pthread -o /tmp/test-handler
          sudo unshare --net sh -c 'ip link set lo up; timeout 30 /tmp/test-handler'
      - name: Check complete display layout and allocation failures
        run: |
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-layout.c -ldl -pthread -o /tmp/test-layout
          timeout 30 /tmp/test-layout
      - name: Check bounded private video capture
        run: |
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-private-capture.c -ldl -pthread -o /tmp/test-private-capture
          timeout 30 /tmp/test-private-capture
      - name: Check authenticated HomeKit screen framing against OpenSSL
        run: |
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-homekit-crypto.c -ldl -pthread -lcrypto -o /tmp/test-homekit-crypto
          timeout 30 /tmp/test-homekit-crypto
      - name: Check authenticated video queue and delayed production grant
        run: |
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-deferred-video.c -o /tmp/test-deferred-video
          timeout 30 /tmp/test-deferred-video
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer -DALTSCREEN_TEST_WITH_GATE tests/test-homekit-crypto.c -ldl -pthread -lcrypto -o /tmp/test-homekit-gate
          timeout 30 /tmp/test-homekit-gate
      - name: Check auxiliary-only asynchronous keyframe recovery
        run: |
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-aux-refresh.c -ldl -pthread -o /tmp/test-aux-refresh
          timeout 30 /tmp/test-aux-refresh
      - name: Check auxiliary SETUP response schema
        run: |
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test-screen-response.c -ldl -pthread -o /tmp/test-screen-response
          timeout 30 /tmp/test-screen-response
      - name: Check atomic startup-file backup and restore
        run: |
          gcc -g -O1 -Wall -Wextra -fsanitize=address,undefined -DFILE_GUARD_TEST recovery/file-guard.c -o /tmp/file-guard
          python3 tests/test-file-guard.py /tmp/file-guard
          python3 tests/test-video-export.py /tmp/file-guard
          python3 tests/test-housekeeping.py /tmp/file-guard recovery/cleanup-v19.sh.in
      - name: Check observation-only security library interposition
        run: python3 tests/test-security-probe.py deploy-usb/payload/security-probe.c
      - name: Check explicit dependency on a copied executable
        run: |
          python3 tests/test-elf-dependency.py tools/add-handler-dependency.py
      - name: Check recovery-first one-shot boot
        run: |
          python3 tests/test-oneshot-boot.py /tmp/file-guard recovery/oneshot-boot.sh.in
          python3 tests/test-oneshot-setup.py /tmp/file-guard recovery/oneshot-usb.sh.in recovery/oneshot-boot.sh.in
          python3 tests/test-oneshot-boot.py /tmp/file-guard recovery/map-v4-boot.sh.in
          python3 tests/test-oneshot-setup.py /tmp/file-guard recovery/map-v4-usb.sh.in recovery/map-v4-boot.sh.in
          python3 tests/test-oneshot-boot.py /tmp/file-guard recovery/info-v5-boot.sh.in
          python3 tests/test-oneshot-setup.py /tmp/file-guard recovery/info-v5-usb.sh.in recovery/info-v5-boot.sh.in
          python3 tests/test-oneshot-boot.py /tmp/file-guard recovery/map-v6-boot.sh.in
          python3 tests/test-oneshot-setup.py /tmp/file-guard recovery/map-v6-usb.sh.in recovery/map-v6-boot.sh.in
          python3 tests/test-oneshot-boot.py /tmp/file-guard recovery/map-v19-boot.sh.in
          python3 tests/test-oneshot-setup.py /tmp/file-guard recovery/map-v19-usb.sh.in recovery/map-v19-boot.sh.in
          python3 tests/test-oneshot-boot.py /tmp/file-guard recovery/map-v24-boot.sh.in
          python3 tests/test-oneshot-setup.py /tmp/file-guard recovery/map-v24-usb.sh.in recovery/map-v24-boot.sh.in
      - name: Check deferred native-encoder handoff and production output gate
        run: python3 tests/test-frame-handoff.py deploy-usb/payload/frame-gate-v12.h recovery/map-v12-log-collector.sh /tmp/file-guard
      - name: Check v13 session lease and native restoration
        run: |
          gcc -O2 -Wall -Wextra -Werror recovery/packet-audit.c -o /tmp/packet-audit
          python3 tests/test-lease-v13.py deploy-usb/payload/frame-gate-v13.h recovery/map-v13-log-collector.sh /tmp/file-guard /tmp/packet-audit
      - name: Check v19 session lease
        run: python3 tests/test-lease-v19.py deploy-usb/payload/frame-gate-v19.h recovery/map-v19-log-collector.sh /tmp/file-guard /tmp/packet-audit
      - name: Check V24 map session recovery
        run: python3 tests/test-lease-v24.py deploy-usb/payload/frame-gate-v24.h recovery/map-v24-log-collector.sh /tmp/file-guard /tmp/packet-audit
      - name: Check read-only cluster packet audit
        run: |
          gcc -O2 -Wall -Wextra -Werror recovery/packet-audit.c -o /tmp/packet-audit
          sudo python3 tests/test-packet-audit.py /tmp/packet-audit recovery/packet-audit.c
          sudo unshare --net python3 tests/test-packet-audit-vlan.py /tmp/packet-audit --isolated
      - name: Check advertised local display-service discovery
        run: python3 tests/test-display-snapshot.py recovery/map-v13-log-collector.sh
      - name: Decode generated transport stream
        timeout-minutes: 4
        run: |
          python3 -m pip install --timeout 20 --retries 1 --only-binary=:all: --target /tmp/codec-pyav av==19.0.2
          sudo unshare --net sh -c 'ip link set lo up; python3 tests/test-transport-decode.py /tmp/test-handler'
          sudo unshare --net sh -c 'ip link set lo up; python3 tests/test-interframe.py /tmp/test-handler'

  synthetic-codec-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build standalone codec test and metadata helper
        run: |
          gcc -O2 -Wall -Wextra -Werror tools/synthetic-player-v20.c -o /tmp/synthetic-player
          gcc -O2 -Wall -Wextra -Werror -DFILE_GUARD_TEST recovery/file-guard.c -o /tmp/codec-file-guard
          python3 -m pip install --timeout 20 --retries 1 --only-binary=:all: --target /tmp/codec-pyav av==19.0.2
      - name: Check staging and recovery-first startup
        run: |
          python3 tests/test-codec-v20-setup.py /tmp/codec-file-guard recovery
          python3 tests/test-codec-v21-setup.py /tmp/codec-file-guard recovery
      - name: Check controller refusal and restoration
        run: |
          python3 tests/test-codec-v20-controller.py recovery/codec-v20-controller.sh.in
          python3 tests/test-codec-v21-controller.py recovery/codec-v21-controller.sh.in
      - name: Check paced isolated multicast and decode every picture
        run: sudo unshare --net python3 tests/test-synthetic-player-v20.py /tmp/synthetic-player --network
      - name: Check real service death and timeout restoration
        run: |
          sudo python3 tests/test-codec-v20-systemd.py recovery/codec-v20-controller.sh.in
          sudo python3 tests/test-codec-v21-systemd.py recovery/codec-v21-controller.sh.in recovery/codec-v21.service.in
  synthetic-timing-v22:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build timing player and metadata helper
        run: |
          gcc -O2 -Wall -Wextra -Werror tools/synthetic-player-v22.c -o /tmp/player-v22
          gcc -O2 -Wall -Wextra -Werror -DFILE_GUARD_TEST recovery/file-guard.c -o /tmp/guard-v22
          python3 -m pip install --timeout 20 --retries 1 --only-binary=:all: --target /tmp/codec-pyav av==19.0.2
      - name: Verify unchanged recovery safeguards for V22
        run: |
          python3 tests/test-codec-v22-setup.py /tmp/guard-v22 recovery
          python3 tests/test-codec-v22-controller.py recovery/codec-v22-controller.sh.in
          sudo python3 tests/test-codec-v22-systemd.py recovery/codec-v22-controller.sh.in recovery/codec-v22.service.in
      - name: Verify continuous Baseline playback and timing summaries
        run: sudo unshare --net python3 tests/test-synthetic-player-v22.py /tmp/player-v22 --network
  factory-timing-v23:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build bounded passive observer and metadata helper
        run: |
          gcc -O2 -Wall -Wextra -Werror recovery/packet-timing-v23.c -o /tmp/timing-v23
          gcc -O2 -Wall -Wextra -Werror -DFILE_GUARD_TEST recovery/file-guard.c -o /tmp/guard-v23
      - name: Verify exact timestamp arithmetic and malformed data
        run: python3 tests/test-packet-timing-v23.py recovery/packet-timing-v23.c
      - name: Verify actual passive packet capture and bounded lifetime
        run: |
          sudo unshare --net sh -c 'ip link set lo up; python3 tests/test-packet-audit.py /tmp/timing-v23 recovery/packet-timing-v23.c'
          sudo unshare --net python3 tests/test-packet-audit-vlan.py /tmp/timing-v23 --isolated
      - name: Verify factory-first setup, refusal and restoration
        run: |
          python3 tests/test-codec-v23-setup.py /tmp/guard-v23 recovery
          python3 tests/test-codec-v23-controller.py recovery/codec-v23-controller.sh.in
          sudo python3 tests/test-codec-v23-systemd.py recovery/codec-v23-controller.sh.in recovery/codec-v23.service.in
  map-v24-report-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Recover retained reports with independent checked export
        run: sudo python3 tests/test-map-v24-collect.py recovery/map-v24-collect.sh.in
  codec-v20-report-collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check collection without unit-side mutations
        run: python3 tests/test-codec-v20-collect.py recovery/codec-v20-collect.sh.in